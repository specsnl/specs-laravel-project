name: Setup node
description: Compose action that sets up node

inputs:
  github-token:
    description: Add a Github Token which will be used for fetching node packages
  run-pnpm-build:
    description: Run pnpm build script
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup node
      uses: actions/setup-node@v7
      id: setup-node
      with:
        node-version-file: .nvmrc
        cache: pnpm
        registry-url: https://npm.pkg.github.com
        token: ${{ inputs.github-token }}

    - name: Install pnpm dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Run pnpm build
      if: ${{ inputs.run-pnpm-build == 'true' }}
      shell: bash
      run: pnpm run build
