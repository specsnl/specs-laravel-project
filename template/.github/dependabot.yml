# Config options: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
multi-ecosystem-groups:
  specsnl-php-images:
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: laravel/framework
        update-types: [version-update:semver-major]
    cooldown:
      default-days: 3
    labels:
      - dependencies
      - php
    commit-message:
      prefix: build
      include: scope
    groups:
      composer-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: build
      include: scope
    groups:
      vite:
        patterns:
          - vite
          - laravel-vite-plugin
[[- if .AddE2E ]]
      playwright:
        patterns:
          - "@playwright/test"
[[- end ]]
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      exclude:
        - "specsnl/github-actions*"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: build
      include: scope
    groups:
      specsnl-actions:
        patterns:
          - "specsnl/github-actions*"
  - package-ecosystem: docker
    directories:
      - /php
      - /nginx
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      exclude:
        - "specsnl/php*"
    ignore:
      - dependency-name: alpine
        update-types: [version-update:semver-major, version-update:semver-minor]
    labels:
      - dependencies
      - docker
    multi-ecosystem-group: specsnl-php-images
    patterns:
      - "specsnl/php*"
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      exclude:
        - "specsnl/php*"
    ignore:
      - dependency-name: "[[ .Database ]]"
[[- if eq .Database "postgres" ]]
        update-types: [version-update:semver-major]
[[- else ]]
        update-types: [version-update:semver-major, version-update:semver-minor]
[[- end ]]
[[- if .AddE2E ]]
      # Bumped by hand together with @playwright/test in package.json (versions must match)
      - dependency-name: mcr.microsoft.com/playwright
[[- end ]]
    labels:
      - dependencies
      - docker
    multi-ecosystem-group: specsnl-php-images
    patterns:
      - "specsnl/php*"
