# https://taskfile.dev
version: '3.50'

tasks:

  shell:
    desc: Shell into gomplate
    cmds:
      - task: :dc:run:gomplate
        vars:
          RUN_FLAGS: --entrypoint=""
          SUB_CMD: /bin/sh

  generate:
    desc: Generate the .env file
    cmds:
      - task: :dc:run:gomplate
        vars:
          RUN_FLAGS: >-
            --env ORBSTACK_ENABLED={{ .ORBSTACK_ENABLED }}
            --env ORB_APP_HOST={{ .ORB_APP_HOST }}
          SUB_CMD: >-
            --file .env.template
            --out .env

  generate:testing:
    desc: Template .env.testing
    run: once
    cmds:
      - cp .env.testing.example .env.testing
    sources:
      - .env.testing.example
    generates:
      - .env.testing
