# https://taskfile.dev
version: "3.50.0"

tasks:
  checkstyle:
    desc: Check style of Markdown files
    cmds:
      - task: :dc:run:markdown-linter
        vars:
          SUB_CMD: "{{ .SUB_CMD }}"

  fixstyle:
    desc: Fix style of Markdown files
    cmds:
      - task: checkstyle
        vars:
          SUB_CMD: --fix
