# https://taskfile.dev
version: '3.50'

tasks:

  install:
    desc: Install node dependencies
    cmds:
      - task: cmd:install
        vars:
          SUB_CMD: '--frozen-lockfile'

  update:
    desc: Update node dependencies
    cmds:
      - task: :setup:auth
      - task: :dc:run:php-exec
        vars:
          SUB_CMD: 'pnpm update'

  corepack:update:
    aliases: [ corepack:up ]
    desc: Run corepack up
    cmds:
      - task: :dc:run:php
        vars:
          SUB_CMD: 'corepack up'
          CLI_ARGS: '{{ .CLI_ARGS }}'

  cmd:*:
    desc: Run a pnpm command inside the php service
    vars:
      PNPM_CMD: '{{ index .MATCH 0 }}'
    cmds:
      - task: :dc:run:php
        vars:
          SUB_CMD: 'pnpm {{ .PNPM_CMD }} {{ .SUB_CMD }}'
          CLI_ARGS: '{{ .CLI_ARGS }}'

  script:*:
    desc: Run a pnpm script
    vars:
      SCRIPT: '{{ index .MATCH 0 }}'
    cmds:
      - task: cmd:run
        vars:
          SUB_CMD: '{{ .SCRIPT }}'
          CLI_ARGS: '-- {{ .CLI_ARGS }}'
