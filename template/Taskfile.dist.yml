# https://taskfile.dev
version: '3.50'

vars:
  BASE_PATH:
    sh: pwd
  ORBSTACK_ENABLED:
    sh: test "$(docker context show)" = "orbstack" && echo 1 || echo 0
  ORB_APP_HOST: https://[[ .ProjectShortName | toKebabCase ]].local

# env:
#   BUILDKIT_PROGRESS: plain

silent: true

includes:
  composer: .taskfiles/Taskfile.composer.yml
  artisan: .taskfiles/Taskfile.artisan.yml
  npm: .taskfiles/Taskfile.npm.yml
  db: .taskfiles/Taskfile.db.yml
[[- if .AddE2E ]]
  e2e: .taskfiles/Taskfile.e2e.yml
[[- end ]]
  setup: .taskfiles/Taskfile.setup.yml
  md: .taskfiles/Taskfile.md.yml
  cleanup: .taskfiles/Taskfile.cleanup.yml
  worktrees: .taskfiles/Taskfile.worktrees.yml

tasks:

  dc:
    internal: true
    vars:
      FIXUID:
        sh: echo ${FIXUID:-$(id -u)}
      FIXGID:
        sh: echo ${FIXGID:-$(id -g)}
    cmds:
      - >-
        FIXUID={{ .FIXUID }} FIXGID={{ .FIXGID }}
        docker compose
        --file compose.yml
        --file compose.mounts.yml
        {{ if eq .ORBSTACK_ENABLED "0" }}
        --file compose.ports.yml
        {{ end }}
        {{ .SUB_CMD }} {{ .CLI_ARGS }}

  dc:run:*:
    interactive: true
    vars:
      SERVICE: '{{ index .MATCH 0 }}'
      RUN_FLAGS: '{{ .RUN_FLAGS | default "" }}'
      USER_FLAG: '{{ (ne (.NON_ROOT | default "true") "false") | ternary " --user $(id -u):$(id -g)" "" }}'
      COMPOSE_SERVICES:
        sh: COMPOSE_PROFILES="*" docker compose config --services
    cmds:
      - task: dc
        vars:
          SUB_CMD: 'run --rm {{ .RUN_FLAGS }} {{ .USER_FLAG }} {{ .SERVICE }} {{ .SUB_CMD }}'
          CLI_ARGS: '{{ .CLI_ARGS }}'
    requires:
      vars:
        - name: SERVICE
          enum:
            ref: .COMPOSE_SERVICES | splitLines | compact

  build:
    desc: Build all docker images
    deps: [ setup:env-file:local ]
    preconditions:
      - sh: test -f auth.json
        msg: Create an auth.json file by running "task setup:auth".
    cmds:
      - task: dc
        vars:
          SUB_CMD: 'build --build-arg USER_UID=$(id -u) --build-arg USER_GID=$(id -g)'

  up:
    desc: Start development environment
    cmds:
      - task: setup:env-file:local
      - task: setup:env-file:testing
      - task: setup:if-not-exist
      - task: dc
        vars:
          SUB_CMD: 'up -d'
[[- if .AddE2E ]]

  ci:up:
    desc: Start the environment on a fresh CI runner (skips the setup:if-not-exist guard)
    cmds:
      - task: setup:env-file:local
      - task: setup:env-file:testing
      - task: composer:install
      - task: npm:install
      - task: dc
        vars: { SUB_CMD: 'up -d' }
      - task: artisan:run:key:generate
      - task: artisan:run:storage:link
        vars: { SUB_CMD: '--quiet' }
      - task: dc:run:php
        vars: { SUB_CMD: 'bash -c "wait-for-it [[ .DbHost ]]:[[ .DbPort ]] --timeout=0 --strict -- echo \"Done waiting\""' }
      - task: db:migrate-fresh:local
      - task: npm:script:build
[[- end ]]

  stop:
    desc: Stop development environment
    cmds:
      - task: dc
        vars:
          SUB_CMD: 'stop'

  restart:
    desc: Restart development environment
    cmds:
      - task: stop
      - task: up

  down:
    desc: Down the development environment
    cmds:
      - task: dc
        vars:
          SUB_CMD: 'down --volumes --remove-orphans'

  reset:
    desc: Reset the development environment
    cmds:
      - task: down
      - task: up

  ps:
    desc: Show all project container (including stopped ones)
    aliases: [ status ]
    cmds:
      - task: dc
        vars:
          SUB_CMD: 'ps -a'

  logs:
    desc: Show logs of all project containers
    cmds:
      - task: dc
        vars:
          SUB_CMD: 'logs -f'

  shell:
    desc: Open a bash shell to the php service
    cmds:
      - task: shell:php

  shell:*:
    desc: Open a bash shell to a service
    vars:
      SERVICE: '{{ index .MATCH 0 }}'
    cmds:
      - task: dc
        vars:
          SUB_CMD: 'exec {{ .SERVICE }} /bin/bash'

  checkall:
    desc: Run all checks
    cmds:
      - task: composer:script:checkall
        vars:
          CLI_ARGS: ''
      - task: md:checkstyle

  refresh:
    desc: Refresh the application
    cmds:
      # - task: setup:env-file:local # for now comment because user might lose existing .env values... will add a "smarter" way to do this later
      - task: setup:env-file:testing
      - task: composer:install
      - task: npm:install
      # We are only adding new migrations and not running migrate:refresh so we don't lose our data for the dev environment:
      - task: db:migrate:local
      - task: db:migrate-fresh:testing
      - task: npm:script:build
