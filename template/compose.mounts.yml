volumes:
  cache:
  db_data:

services:
  volume-init:
    volumes:
      - cache:/cache

  php-exec:
    depends_on:
      volume-init:
        condition: service_completed_successfully
    volumes:
      - ./:/var/www/
      - cache:/cache
      - ./auth.json:/config/composer/auth.json:ro

  php:
    depends_on:
      volume-init:
        condition: service_completed_successfully
    volumes:
      - ./:/var/www/
      - cache:/cache
      - ./auth.json:/config/composer/auth.json:ro

  worker:
    depends_on:
      volume-init:
        condition: service_completed_successfully
    volumes:
      - ./:/var/www/
      - cache:/cache
      - ./auth.json:/config/composer/auth.json:ro

  nginx:
    volumes:
      - ./public:/var/www/public
      - ./storage:/var/www/storage

  db_app:
    volumes:
[[- if eq .Database "postgres" ]]
      - db_data:/var/lib/postgresql
      - ./db_app/init:/docker-entrypoint-initdb.d
[[- else ]]
      - db_data:/var/lib/mysql
      - ./db_app/init:/docker-entrypoint-initdb.d
      - ./db_app/custom.cnf:/etc/mysql/conf.d/custom.cnf
[[- end ]]

  markdown-linter:
    volumes:
      - ./:/workdir
[[- if .AddE2E ]]

  e2e-playwright:
    volumes:
      - ./:/var/www/
      - cache:/cache
[[- end ]]

  gomplate:
    volumes:
      - ./:/workdir
