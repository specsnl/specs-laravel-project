volumes:
  [[ .ProjectShortName |toSnakeCase ]]_cache:
    external: true
  [[ eq .Database "postgres" | ternary "postgres_data:" (eq .Database "mysql" | ternary "mysql_data:" "mariadb_data:") ]]

services:
  php-exec:
    volumes:
      - ./:/var/www/
      - [[ .ProjectShortName | toSnakeCase ]]_cache:/cache
      - ./auth.json:/config/composer/auth.json:ro

  php:
    volumes:
      - ./:/var/www/
      - [[ .ProjectShortName | toSnakeCase ]]_cache:/cache
      - ./auth.json:/config/composer/auth.json:ro

  worker:
    volumes:
      - ./:/var/www/
      - [[ .ProjectShortName | toSnakeCase ]]_cache:/cache
      - ./auth.json:/config/composer/auth.json:ro

  nginx:
    volumes:
      - ./public:/var/www/public
      - ./storage:/var/www/storage

[[- if eq .Database "postgres" ]]

  postgres:
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
[[- else if eq .Database "mysql" ]]

  mysql:
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf
[[- else ]]

  mariadb:
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d
      - ./mariadb/custom.cnf:/etc/mysql/conf.d/custom.cnf
[[- end ]]

  markdown-linter:
    volumes:
      - ./:/workdir
