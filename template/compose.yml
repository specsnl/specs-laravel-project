secrets:
  composer_auth:
    file: ${COMPOSER_AUTH_FILE:-./auth.json}

services:
  php-exec:
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    entrypoint: ["fixuid", "-q"]
    image: ghcr.io/specsnl/php[[ .PhpVersion | replace "."  "" ]]/builder_nodejs:[[ .PhpDockerTag ]]
    profiles: [exec]
    environment:
      COREPACK_DEFAULT_TO_LATEST: 0
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

  volume-init:
    image: busybox:1.37.0-musl
    user: root
    command:
      - sh
      - -c
      - |
        mkdir -p /cache/node
        chown -R ${FIXUID:-1000}:${FIXGID:-1000} /cache

  php:
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    build:
      context: .
      dockerfile: php/Dockerfile
      target: builder-local
      secrets:
        - composer_auth
    secrets:
      - composer_auth

  worker:
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    build:
      context: .
      dockerfile: php/Dockerfile
      target: builder-local
      secrets:
        - composer_auth
    restart: unless-stopped
    command:
      - bash
      - -c
      - "trap : 3 ; wait-for-it [[ .DbHost ]]:[[ .DbPort ]] --strict --timeout=20 -- php artisan queue:listen --sleep=10 & wait"
    environment:
      PHP_COMPOSER_INSTALL_DEV: false
    depends_on:
      - php
      - [[ .DbHost ]]

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      secrets:
        - composer_auth
    depends_on:
      - php
    environment:
      CGI_HOST: "php.${COMPOSE_PROJECT_NAME}_default"
    labels:
      - dev.orbstack.domains=${COMPOSE_PROJECT_NAME:-[[ .ProjectShortName | toKebabCase ]]}.local
      - dev.orbstack.http-port=80
    networks:
      default:
        aliases:
          - ${COMPOSE_PROJECT_NAME:-[[ .ProjectShortName | toKebabCase ]]}.local

  db_app:
    image: [[ .DbImageTag ]]
    environment:
[[- if eq .Database "postgres" ]]
      POSTGRES_DB: ${DB_APP_DATABASE}
      POSTGRES_USER: ${DB_APP_USER}
      POSTGRES_PASSWORD: ${DB_APP_PASSWORD}
[[- else if eq .Database "mysql" ]]
      MYSQL_ROOT_PASSWORD: ${DB_APP_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_APP_DATABASE}
      MYSQL_USER: ${DB_APP_USER}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD}
[[- else ]]
      MARIADB_ROOT_PASSWORD: ${DB_APP_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_APP_DATABASE}
      MARIADB_USER: ${DB_APP_USER}
      MARIADB_PASSWORD: ${DB_APP_PASSWORD}
[[- end ]]
    labels:
      - dev.orbstack.domains=db.${COMPOSE_PROJECT_NAME:-[[ .ProjectShortName | toKebabCase ]]}.local

  mailpit:
    image: axllent/mailpit:v1.30.2
    labels:
      - dev.orbstack.domains=mail.${COMPOSE_PROJECT_NAME:-[[ .ProjectShortName | toKebabCase ]]}.local
      - dev.orbstack.http-port=8025

  markdown-linter:
    image: davidanson/markdownlint-cli2:v0.22.1
    profiles: [markdown-lint]

[[- if .AddE2E ]]

  e2e-playwright:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.61.0-noble
    working_dir: /var/www
    depends_on:
      - nginx
    environment:
      BASE_URL: http://${COMPOSE_PROJECT_NAME:-[[ .ProjectShortName | toKebabCase ]]}.local

[[- end ]]

  gomplate:
    profiles: [template]
    image: gomplate/gomplate:v5.1.0-alpine
    working_dir: /workdir
