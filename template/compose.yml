secrets:
  composer_auth:
    file: ${COMPOSER_AUTH_FILE:-./auth.json}

services:
  php-exec:
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    entrypoint: ["fixuid", "-q"]
    image: ghcr.io/specsnl/php[[ .PhpVersion | replace "."  "" ]]/builder_nodejs:[[ .PhpDockerTag ]]
    profiles: [exec]
    environment:
      COREPACK_DEFAULT_TO_LATEST: 0
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

  php:
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    build:
      context: .
      dockerfile: php/Dockerfile
      target: builder-local
      secrets:
        - composer_auth
    secrets:
      - composer_auth

  worker:
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    build:
      context: .
      dockerfile: php/Dockerfile
      target: builder-local
      secrets:
        - composer_auth
    restart: unless-stopped
    command:
      - bash
      - -c
      - "trap : 3 ; wait-for-it [[ .DbHost ]]:[[ .DbPort ]] --strict --timeout=20 -- wait-for-it redis:6379 --strict --timeout=20 -- php artisan queue:listen --sleep=10 & wait"
    environment:
      PHP_COMPOSER_INSTALL_DEV: false
    depends_on:
      - php
      - redis
      - [[ .DbHost ]]

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      secrets:
        - composer_auth
    depends_on:
      - php
    environment:
      CGI_HOST: "php.${COMPOSE_PROJECT_NAME}_default"
    labels:
      - dev.orbstack.domains=${COMPOSE_PROJECT_NAME:-[[ .ProjectShortName | toKebabCase ]]}.local
      - dev.orbstack.http-port=80
[[- if .AddE2E ]]
    networks:
      default:
        aliases:
          - ${COMPOSE_PROJECT_NAME:-[[ .ProjectShortName | toKebabCase ]]}.local
[[- end ]]

[[- if eq .Database "postgres" ]]

  postgres:
    image: postgres:18.4-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    labels:
      - dev.orbstack.domains=db.${COMPOSE_PROJECT_NAME:-[[ .ProjectShortName | toKebabCase ]]}.local
[[- else if eq .Database "mysql" ]]

  mysql:
    image: mysql:8.4.9
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    labels:
      - dev.orbstack.domains=db.${COMPOSE_PROJECT_NAME:-[[ .ProjectShortName | toKebabCase ]]}.local
[[- else ]]

  mariadb:
    image: mariadb:11.8.6-noble
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    labels:
      - dev.orbstack.domains=db.${COMPOSE_PROJECT_NAME:-[[ .ProjectShortName | toKebabCase ]]}.local
[[- end ]]

  redis:
    image: redis:7.4.9-bookworm
    labels:
      - dev.orbstack.domains=redis.${COMPOSE_PROJECT_NAME:-[[ .ProjectShortName | toKebabCase ]]}.local

  mailpit:
    image: axllent/mailpit:v1.30.2
    labels:
      - dev.orbstack.domains=mail.${COMPOSE_PROJECT_NAME:-[[ .ProjectShortName | toKebabCase ]]}.local
      - dev.orbstack.http-port=8025

  markdown-linter:
    image: davidanson/markdownlint-cli2:v0.22.1
    profiles: [markdown-lint]
[[- if .AddE2E ]]

  e2e-playwright:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.61.0-noble
    working_dir: /var/www
    depends_on:
      - nginx
    environment:
      BASE_URL: http://${COMPOSE_PROJECT_NAME:-[[ .ProjectShortName | toKebabCase ]]}.local
[[- end ]]
